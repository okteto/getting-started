apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
data:
  # MongoDB runs the scripts of /docker-entrypoint-initdb.d once, when its volume is empty.
  # This one creates the user that the api and the seed job connect with.
  init.js: |
    db.createUser({
      user: process.env.MONGODB_USERNAME,
      pwd: process.env.MONGODB_PASSWORD,
      roles: [{ role: "readWrite", db: process.env.MONGO_INITDB_DATABASE }],
    });
