apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
    spec:
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: password
            - name: MONGO_INITDB_DATABASE
              value: okteto
            - name: MONGODB_USERNAME
              value: okteto
            - name: MONGODB_PASSWORD
              value: password
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          # MongoDB only listens on the Pod IP once the init scripts finish.
          readinessProbe:
            periodSeconds: 2
            tcpSocket:
              port: mongodb
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb
        - name: init
          configMap:
            name: mongodb-init
