build:
  api:
    context: api

  frontend:
    context: frontend

deploy:
  image: alpine/helm:4.3.2
  commands:
    - name: Deploy MongoDB
      command: |
        helm upgrade --install mongodb oci://registry-1.docker.io/bitnamicharts/mongodb \
          --version 20.0.21 \
          --set auth.rootPassword=password \
          --set "auth.usernames={okteto}" \
          --set "auth.passwords={password}" \
          --set "auth.databases={okteto}"

    - name: Deploy the Movies app
      command: |
        helm upgrade --install movies chart \
          --set api.image=${OKTETO_BUILD_API_IMAGE} \
          --set frontend.image=${OKTETO_BUILD_FRONTEND_IMAGE}

test:
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    context: e2e
    caches:
      - /root/.npm
    commands:
      - bash run_tests.sh
    artifacts:
      - test-results
      - playwright-report
